<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bốn mùa</title>

    <style>
        :root {
            --nen: #FFFDE7;
            --vien: #9E9E9E;
            --do: #D40000;
            --hong: #FFD9E6;
            --xanh: #0033CC;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            font-family: "Times New Roman", serif;
        }

        .khung {
            width: 640px;
            padding: 24px;
            background-color: var(--nen);
            border: 1px solid var(--vien);
            text-align: center;
        }

        h1 {
            color: var(--do);
            background-color: var(--hong);
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 20px;
            padding: 6px 0;
        }

        .kho-tho {
            font-size: 22px;
            font-style: italic;
            line-height: 1.7;
            color: var(--xanh);
        }

        .kho-2 {
            color: var(--do);
        }

        hr {
            width: 55%;
            border: none;
            border-top: 2px solid #6688FF;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <main class="khung">

        <h1>BỐN MÙA</h1>

        <p class="kho-tho">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <p class="kho-tho kho-2">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>

        <p class="kho-tho">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>

    </main>

</body>
</html>
